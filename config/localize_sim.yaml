particle_filter:
  ros__parameters:
    use_sim_time: true
    # topic names
    scan_topic: '/scan'
    odometry_topic: '/ego_racecar/odom'
    # frame ids
    # Keep these equal to the old hardcoded values by default.
    map_frame: '/map'
    base_frame: '/ego_racecar/base_link'
    laser_frame: '/ego_racecar/laser'
    # laser extrinsic relative to base_frame
    laser_offset_x: 0.27
    laser_offset_y: 0.0
    laser_offset_yaw: 0.0
    # range data downsampling
    angle_step: 18
    max_particles: 4000
    squash_factor: 2.2
    # visualization
    viz: 1
    max_viz_particles: 60
    # ray marching method
    range_method: 'rm'
    theta_discretization: 112
    # range data filtering
    max_range: 10
    fine_timing: 0
    publish_odom: 1
    # sensor model constants
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25
    # sensor model variant, variant 2 good for rmgpu, 3 doesn't work for rmgpu
    rangelib_variant: 2

    # PF health monitor only (does not modify PF pose / TF / /pf/pose/odom)
    # status on /pf/health: 1=GOOD, 2=DEGRADED_BUT_USABLE, 3=INVALID
    # /pf/health layout:
    # [0] status
    # [1] static_match_ratio
    # [2] static_scan_error_median [m]
    # [3] obstacle_short_ratio
    # [4] xy_spread [m]
    # [5] longitudinal_residual [m]
    # [6] lateral_residual [m]
    # [7] yaw_residual [rad]
    # [8] n_eff_ratio

    # Static map scan consistency. Obstacle-short rays are filtered out before
    # static_match_ratio and static_scan_error_median are computed.
    good_match_ratio: 0.85
    degraded_match_ratio: 0.75
    good_scan_error_m: 0.10
    degraded_scan_error_m: 0.20
    obstacle_short_error_m: 0.50

    # Particle cloud position spread. 
    # was too tight and caused GOOD/DEGRADED switching during otherwise good scans.
    max_good_xy_spread_m: 0.25
    max_degraded_xy_spread_m: 0.50

    # Raw PF delta vs raw ego odometry delta consistency.
    # The subscribed odometry_topic must be raw car/sim odom, not /pf/pose/odom.
    max_good_lateral_residual_m: 0.10
    max_degraded_lateral_residual_m: 0.35
    max_good_yaw_residual_rad: 0.15
    max_degraded_yaw_residual_rad: 0.45

    # Hysteresis counters, in PF update cycles, not seconds.
    # Approx time = count / current PF update rate shown by "iters per sec".
    lost_bad_count: 8
    degraded_bad_count: 5
    recover_good_count: 8

    # Grace updates after RViz /initialpose reset. During this window, health
    # stays GOOD and the intentional manual pose jump is not counted as failure.
    manual_reset_grace_updates: 10

    # Obstacle-present GOOD override.
    # If obstacle_short_ratio is above this value and static_match_ratio is very high,
    # localization can still be GOOD even if xy_spread is above max_good_xy_spread_m,
    # as long as xy_spread does not exceed max_degraded_xy_spread_m.
    obstacle_present_ratio: 0.03
    obstacle_good_match_ratio: 0.90

    # If status remains DEGRADED for this many consecutive PF update cycles,
    # escalate status to INVALID.
    max_degraded_count: 50

map_server:
  ros__parameters:
    # assuming map file is in particle_filter/maps
    map: 'ifac_roboracer'
    # map: 'Yacht_Office_20260311_00'
    # map: 'basement_fixed'
    # map: 'levine_hall_scanned'
